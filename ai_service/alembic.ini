# Configuração do Alembic para o ai_service.
#
# sqlalchemy.url é deixado sem valor aqui de propósito: a URL real de
# conexão vem de app/core/config.py (variável DATABASE_URL do .env),
# lida por alembic/env.py. Manter a URL só em .env evita duplicar
# credencial de banco em dois arquivos que podem ficar dessincronizados.

[alembic]
# Diretório onde vivem env.py e a pasta versions/, relativo à raiz do
# ai_service (onde este arquivo .ini fica).
script_location = alembic

# Nome de arquivo das migrations geradas: timestamp + slug, para ficar
# claro em que ordem cronológica cada revision foi criada só de olhar
# o nome do arquivo, sem precisar abrir e ler o "down_revision".
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Diretório corrente prepended ao sys.path, para env.py conseguir
# `from app.core.config import settings` mesmo quando o comando
# `alembic` é invocado de fora da pasta ai_service.
prepend_sys_path = .

path_separator = os

# database URL. Deixado como placeholder proposital: a URL real é
# injetada por alembic/env.py a partir de app.core.config.settings,
# não lida diretamente daqui pelo Alembic.
sqlalchemy.url =


[post_write_hooks]
# Roda ruff automaticamente em toda migration recém-gerada, para o
# arquivo já sair formatado e sem lint warnings, igual ao resto do
# código do serviço (ver [tool.ruff] em pyproject.toml).
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Logging configuration. Consumido apenas por alembic/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S