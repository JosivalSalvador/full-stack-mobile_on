[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.0",
    "ollama>=0.6.2",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "sqlmodel>=0.0.39",
    "structlog>=26.1.0",
    "uvicorn>=0.51.0",
    "zxcvbn>=4.5.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",   # Sintaxe e estilo PEP 8
    "F",     # Variáveis/imports não usados e erros básicos
    "I",     # Ordenação de imports
    "B",     # Prevenção de bugs comuns
    "UP",    # Atualiza sintaxe para Python 3.12+
    "N",     # Nomenclatura PEP 8
    "FAST",  # Boas práticas para FastAPI
    "RUF",   # Regras nativas do Ruff
]
ignore = [
    "B008",  # Permite usar Depends() nos parâmetros do FastAPI
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true



[tool.pytest.ini_options]
# Layout "flat" (app/ direto na raiz, não dentro de src/): garante que
# `import app...` funciona independente de como pytest é invocado.
pythonpath = ["."]
asyncio_mode = "auto"
