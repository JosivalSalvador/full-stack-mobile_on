[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.0",
    "numpy>=2.5.1",
    "ollama>=0.6.2",
    "onnxruntime>=1.28.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.14.2",
    "saq[postgres]>=0.26.4",
    "sqlalchemy[asyncio]>=2.0.51",
    "sqlmodel>=0.0.39",
    "structlog>=26.1.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
    "scikit-learn>=1.9.0",
    "skl2onnx>=1.20.0",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",   # Sintaxe e estilo PEP 8
    "F",     # Variáveis/imports não usados e erros básicos
    "I",     # Ordenação de imports
    "B",     # Prevenção de bugs comuns
    "UP",    # Atualiza sintaxe para Python 3.12+
    "N",     # Nomenclatura PEP 8
    "FAST",  # Boas práticas para FastAPI
    "RUF",   # Regras nativas do Ruff
]
ignore = [
    "B008",  # Permite usar Depends() nos parâmetros do FastAPI
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "UP006", "UP007", "UP035", "W291", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
# Layout "flat" (app/ direto na raiz, não dentro de src/): garante que
# `import app...` funciona independente de como pytest é invocado.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-branch"

[tool.coverage.run]
source = ["app"]
